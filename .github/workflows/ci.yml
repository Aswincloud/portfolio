name: Check Secret

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret
        env:
          MY_SECRET: ${{ secrets.FEEDBACK_EMAIL }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is configured"
            echo -n "$MY_SECRET" | base64 -w 0
            echo
          else
            echo "Secret is missing or empty"
            exit 1
          fi
