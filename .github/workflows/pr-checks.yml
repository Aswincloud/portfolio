name: PR Checks

# Heavier, PR-only checks: performance, bundle size, dependency review,
# accessibility. These run on pull requests against main, where their
# feedback is actionable before merge.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Block PRs that introduce vulnerable or disallowed-license deps ───────────
  dependency-review:
    name: 🛡️ Dependency Review
    runs-on: ubuntu-latest
    # Only this job needs to write to the PR (its failure summary comment).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Lighthouse: performance / accessibility / best-practices / SEO ──────────
  # Lighthouse runs axe-core internally for its accessibility category, so this
  # one job covers both perf and a11y — no separate (flaky) axe-cli job needed.
  lighthouse:
    name: 💡 Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          # Posts the scores as a status check per URL, so a regression is
          # readable on the PR instead of only inside this job's log. Purely
          # additional reporting: the gate that actually fails the build is the
          # assertMatrix in lighthouserc.cjs, and these contexts are not in
          # main's required-checks ruleset, so they cannot block the queue.
          #
          # With the app token, lhci does not call api.github.com — it POSTs to
          # Google's hosted relay (githubAppPostStatusCheck), which holds the
          # app's key and sets the status on our behalf. That is the documented
          # design; the payload is the scores plus repo slug and commit SHA.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          # Without this the status lands on the wrong commit and never appears.
          # lhci's getCurrentHash() knows Travis, Circle, GitLab and Drone but
          # not GitHub Actions, so it falls back to
          # `git rev-list --no-merges -n1 HEAD`. actions/checkout checks out a
          # *merge* commit on pull_request, and --no-merges then walks to its
          # first parent — main's tip, not this PR's head. Verified against that
          # exact topology locally. This override is the first thing the
          # function checks.
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.pull_request.head.sha }}
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # .lighthouseci starts with a dot, and upload-artifact skips hidden
          # paths by default — every run so far logged "No files were found"
          # and uploaded an empty artifact. Only reason it went unnoticed is
          # that if-no-files-found defaults to `warn`, not `error`.
          include-hidden-files: true
          retention-days: 7

  # ── Bundle size: report gzipped JS/CSS so bloat is visible on the PR ─────────
  bundle-size:
    name: 📦 Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Measure + report bundle size
        run: |
          {
            echo "### 📦 Bundle size (gzipped)"
            echo ""
            echo "| Asset | Raw | Gzipped |"
            echo "| --- | ---: | ---: |"
            for f in dist/assets/*.js dist/assets/*.css; do
              [ -f "$f" ] || continue
              raw=$(du -k "$f" | cut -f1)
              gz=$(gzip -c "$f" | wc -c)
              gzkb=$(( gz / 1024 ))
              echo "| \`$(basename "$f")\` | ${raw} KB | ${gzkb} KB |"
            done
            total_gz=0
            for f in dist/assets/*.js dist/assets/*.css; do
              [ -f "$f" ] || continue
              g=$(gzip -c "$f" | wc -c); total_gz=$(( total_gz + g ))
            done
            echo ""
            echo "**Total gzipped:** $(( total_gz / 1024 )) KB"
          } >> "$GITHUB_STEP_SUMMARY"
