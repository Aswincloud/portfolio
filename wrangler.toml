name = "aswin-portfolio"
main = "worker.js"
# >= 2025-04-01 enables SPA navigation-request optimization: navigations are
# served from assets without invoking the Worker.
compatibility_date = "2025-04-01"
preview_urls = true

[vars]
NODE_ENV = "production"

[[routes]]
pattern = "aswincloud.com/*"
zone_name = "aswincloud.com"

[[routes]]
pattern = "www.aswincloud.com/*"
zone_name = "aswincloud.com"

[assets]
directory = "./dist"
binding = "ASSETS"
# Every route now has a real HTML document in dist (privacy/index.html,
# terms/index.html, 404.html — see scripts/vite-plugin-route-pages.js), each with
# its own canonical URL and title. So the SPA catch-all is no longer needed for
# deep links, and it was actively harmful: it answered *every* unknown path with
# the home page at HTTP 200, which makes typo'd URLs indexable soft-404s.
#
# "404-page" serves dist/404.html with a genuine 404 status. React still renders
# the client-side route from that document, so the page behaves identically; only
# the status line and the head differ.
not_found_handling = "404-page"
# Serve /privacy from privacy/index.html directly. The default,
# "auto-trailing-slash", 307-redirects /privacy to /privacy/ once a
# privacy/index.html exists — verified against `wrangler dev` — which would
# change the site's URLs out from under the canonical tags and the sitemap.
# "drop-trailing-slash" redirects the other way, so /privacy stays the one
# spelling everything publishes.
html_handling = "drop-trailing-slash"
# Only the API needs the Worker. Assets are served directly and get their
# security headers from dist/_headers (generated at build time), which is both
# cheaper and lower-latency than routing every request through the script.
run_worker_first = ["/api/*"]

# Per-IP rate limit for POST /api/contact. Every submission sends two emails (a
# notification and an auto-reply to an address the caller chooses), so an unthrottled
# endpoint is both a spam relay and a way to burn the Resend quota.
#
# `namespace_id` is an arbitrary positive integer that names the counter — it is not
# an account resource and does not need provisioning. `simple.period` only accepts
# 10 or 60. The limiter is per-Cloudflare-location and eventually consistent, so treat
# 5/minute as an order of magnitude rather than an exact quota; the Worker also fails
# open if this binding is missing, so a config regression can't take the form offline.
[[ratelimits]]
name = "CONTACT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
