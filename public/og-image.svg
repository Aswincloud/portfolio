<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060a13"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Aurora glows -->
  <circle cx="1050" cy="120" r="380" fill="url(#glowA)"/>
  <circle cx="120" cy="560" r="340" fill="url(#glowB)"/>

  <!-- Hairline frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#1e2a40" stroke-width="1.5"/>

  <!-- Wordmark -->
  <g transform="translate(96, 96)">
    <rect x="0" y="0" width="46" height="46" rx="11" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-opacity="0.30"/>
    <path d="M13 15 L23 23 L13 31 M25 32 L34 32" stroke="#6ee7b7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="62" y="31" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#ffffff">aswin<tspan fill="#34d399">cloud</tspan></text>
  </g>

  <!-- Eyebrow. The role here and the hero's HERO_EYEBROW are the same claim, and
       they drifted once already — socialCard.test.js now ties them together, so
       edit heroContent.js and re-run `npm run og:build` rather than this line. -->
  <text x="98" y="286" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="500" letter-spacing="4" fill="#6ee7b7">SENIOR SOFTWARE ENGINEER</text>

  <!-- Headline -->
  <text x="94" y="372" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="82" font-weight="700" fill="#ffffff">I make AI accelerators</text>
  <text x="94" y="464" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="82" font-weight="700" fill="#ffffff">go <tspan fill="url(#accent)">faster</tspan>.</text>

  <!-- Sub copy -->
  <text x="98" y="522" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="400" fill="#94a3b8">Profiling &amp; benchmarking on AI silicon · modern web builds · a personal cloud</text>

  <!-- Footer meta -->
  <text x="98" y="566" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="500" fill="#64748b">Pondicherry, India</text>
  <text x="1102" y="566" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="500" fill="#64748b">www.aswincloud.com</text>
</svg>
